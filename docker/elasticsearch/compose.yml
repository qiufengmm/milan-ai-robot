name: milan-rag

services:
  elasticsearch:
    image: milan-rag/elasticsearch-ik:9.4.2
    build:
      context: .
    container_name: milan-rag-elasticsearch
    environment:
      cluster.name: milan-rag-local
      node.name: milan-rag-es-1
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - milan_rag_es_data:/usr/share/elasticsearch/data
    networks:
      - milan_rag_es
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  milan_rag_es_data:
    name: milan_rag_elasticsearch_data_v1

networks:
  milan_rag_es:
    name: milan_rag_elasticsearch_network
