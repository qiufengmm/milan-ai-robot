# 企业内部知识库问答：统一配置，认证与知识库授权始终启用。
# Key、密码和本机覆盖项存放于已忽略的 application-secret.yml。
server:
  port: 8080
  servlet:
    session:
      timeout: 8h
spring:
  config:
    import: optional:classpath:application-secret.yml
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      embedding:
        model: qwen3.7-text-embedding-flash
        dimensions: 1024
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000
        table-name: t_vector_store
        initialize-schema: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${MILAN_ENTERPRISE_DB_HOST:localhost}:${MILAN_ENTERPRISE_DB_PORT:5432}/${MILAN_ENTERPRISE_DB_NAME:milan_enterprise}
    username: ${MILAN_ENTERPRISE_DB_USERNAME:postgres}
    password: ${MILAN_ENTERPRISE_DB_PASSWORD}
    hikari:
      pool-name: MilanEnterprise-HikariCP
      maximum-pool-size: 15
      minimum-idle: 2
  session:
    cookie:
      http-only: true
      same-site: lax
      secure: ${ENTERPRISE_SESSION_COOKIE_SECURE:false}
customer-service:
  file-storage-path: ./data/enterprise/file-storage
  chunk-path: ./data/enterprise/chunk
  model: qwen3.8-flash
  temperature: 0.0
logging:
  config: classpath:log4j2.xml
rag:
  elasticsearch:
    enabled: true
    url: ${ENTERPRISE_ELASTICSEARCH_URL:http://localhost:19200}
    index-name: milan_enterprise_chunks_v1
    analyzer: ik_max_word
    search-analyzer: ik_smart
    timeout-seconds: 10
    sync-delay-ms: 3000
  retrieval:
    vector-top-k: 10
    keyword-top-k: 10
    fused-top-k: 10
    rrf-k: 60
    log-evidence: false
  rerank:
    enabled: true
    model: qwen3-rerank
    top-n: 3
    timeout-seconds: 15
    min-relevance-score: 0.5
okhttp:
  connect-timeout: 5000
  read-timeout: 30000
  write-timeout: 15000
  max-idle-connections: 200
  keep-alive-duration: 5
enterprise:
  bootstrap-admin:
    enabled: ${ENTERPRISE_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${ENTERPRISE_BOOTSTRAP_ADMIN_USERNAME:}
    display-name: ${ENTERPRISE_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    password: ${ENTERPRISE_BOOTSTRAP_ADMIN_PASSWORD:}
