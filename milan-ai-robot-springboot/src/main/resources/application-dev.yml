spring:
  ai:
    openai:
      # base-url 的默认值在 application.yml 中（阿里云百炼公共网关）。
      # 使用专属部署时，请在 application-secret.yml 中覆盖，不要写在本文件——
      # 本文件优先级高于 application-secret.yml，写在这里会把它压住，导致覆盖失效。
      # api-key 属于敏感信息，不再硬编码在源码中，改由 application-secret.yml 提供
      # （该文件已加入 .gitignore，不随源码分发），也支持用环境变量 DASHSCOPE_API_KEY 覆盖
      embedding:
        model: qwen3.7-text-embedding-flash # 向量化模型
        dimensions: 1024 #维度
    vectorstore:
      pgvector:
        index-type: HNSW # 索引类型
        distance-type: COSINE_DISTANCE # 距离类型
        dimensions: 1024 # 嵌入维度
        max-document-batch-size: 10000 # 每批处理的最大文档数
        table-name: t_vector_store # 向量表名称
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver # 数据库驱动类名
    # 电商演示库：milan_ecommerce，表结构与 robot 库完全一致（均由 sql/schema.sql 创建）。
    # 单独建库是为了让「米兰数码商城」的电商知识库与原有的课程/项目知识互不干扰。
    # 想回到原库演示，把库名改回 robot 即可，原库数据未被清空或修改。
    url: jdbc:p6spy:postgresql://localhost:5432/milan_ecommerce # 数据库连接 URL
    username: postgres # 数据库用户名
    password: postgres # 数据库密码
    hikari: # HikariCP 连接池配置
      pool-name: MilanAI-Robot-HikariCP # 自定义连接池名称
      auto-commit: true # 是否自动提交事务
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 600000 # 空闲连接存活最大时间（毫秒）
      max-lifetime: 1800000 # 连接最大存活时间（毫秒）
      minimum-idle: 5 # 最小空闲连接数
      maximum-pool-size: 20 # 最大连接池大小
      validation-timeout: 5000 # 验证连接的有效性（配合 JDBC4 的 isValid() 使用，无需 connection-test-query）
okhttp: # OkHttp 客户端配置
  connect-timeout: 5000    # 建立连接的最大等待时间（毫秒）
  read-timeout: 30000      # 读取数据的最大等待时间（毫秒）
  write-timeout: 15000     # 写入数据的最大等待时间（毫秒）
  max-idle-connections: 200 # 连接池中保持的最大空闲连接数
  keep-alive-duration: 5   # 空闲连接在连接池中的存活时间（分钟）

searxng: # SearXNG 搜索引擎配置
  url: http://localhost:8888/search # SearXNG 服务的 API 端点地址
  count: 10 # 每次从搜索结果中，提取的最大数量
customer-service:
  # md-storage-path 的默认值在 application.yml 中（./data/md-storage）。
  # 想在本机固定到其他目录，请在 application-secret.yml 中覆盖（本文件优先级更高，写在这里会让覆盖失效）。
  model: deepseek-v4-flash-0731 # 模型名称
  temperature: 0.0 # 温度值
